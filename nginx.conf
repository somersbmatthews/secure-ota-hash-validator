server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Everything is local: no external scripts, styles, fonts or network calls.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Files aren't fingerprinted, so let browsers revalidate rather than cache blindly.
    # (`expires` is used instead of add_header so the headers above are still inherited.)
    location ~* \.(?:html|css|js)$ {
        expires -1;
    }

    # No favicon ships with the app; avoid a 404 in the console and access log.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
